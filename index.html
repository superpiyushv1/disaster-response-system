<!DOCTYPE html>
<html>
<head>
    <title>Smart Disaster Response System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0e14;
            --accent-red: #ff4d4d;
            --accent-blue: #00d2ff;
            --accent-orange: #ff9f43;
            --glass: rgba(15, 20, 30, 0.9);
        }

        body { 
            margin: 0; 
            background: var(--bg-dark); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        #map-wrapper {
            height: 100vh;
            width: 100%;
            background: #000;
            position: absolute;
            z-index: 1;
        }

        #map { 
            height: 100%; 
            width: 100%; 
            /* Subtle contrast boost without the "foggy" invert filter */
            filter: saturate(1.2) contrast(1.1) brightness(0.9);
        }
        
        #header-lite {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--glass);
            padding: 12px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #fff;
        }

        .status-container {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            color: #94a3b8;
        }

        #status-dot {
            height: 6px;
            width: 6px;
            background: #48bb78;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px #48bb78;
        }

        /* Notifications Sidebar */
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 300px;
            z-index: 1000;
            display: flex;
            flex-direction: column-reverse; 
            gap: 12px;
        }

        .notification {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--accent-red);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .quake-notif { border-left-color: var(--accent-red); }
        .flood-notif { border-left-color: var(--accent-blue); }
        .notif-title { font-weight: 700; font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
        .notif-loc { font-size: 14px; color: #fff; font-weight: bold; }
        .notif-val { font-family: 'Orbitron', sans-serif; font-size: 20px; margin-top: 5px; }
        .quake-notif .notif-val { color: var(--accent-red); }
        .flood-notif .notif-val { color: var(--accent-blue); }

    </style>
</head>
<body>

    <div id="header-lite">
        <h1>SMART DISASTER RESPONSE SYSTEM</h1>
        <div class="status-container">
            <span id="status-dot"></span> <span id="status-text">RADAR ACTIVE</span>
        </div>
    </div>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>
    
    <div id="ui-overlay"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map with better zoom depth
        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 4,
            maxZoom: 12,
            wheelDebounceTime: 100
        }).setView([22.5937, 78.9629], 5);
        
        // 2. High-Contrast Dark Tiles WITH Labels
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO',
            noWrap: true
        }).addTo(map);

        // 3. Orange India Border (Safety Glow)
        fetch('https://raw.githubusercontent.com/datameet/maps/master/Country/india-composite.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: "#ff9f43", 
                        weight: 2,
                        opacity: 0.8,
                        fillColor: "transparent",
                        interactive: false
                    }
                }).addTo(map);
            });

        const cityCoords = {
            "Janakpuri, New Delhi": [28.6215, 77.0878],
            "Cyber City, Gurugram": [28.4951, 77.0894],
            "Bandra West, Mumbai": [19.0596, 72.8295],
            "Whitefield, Bengaluru": [12.9698, 77.7500],
            "HITEC City, Hyderabad": [17.4483, 78.3741],
            "Salt Lake, Kolkata": [22.5851, 88.4231],
            "Noida Sector 18, UP": [28.5708, 77.3261]
        };

        let processedIds = new Set();

        async function updateRadar() {
            try {
                const response = await fetch('https://disaster-backend-api-7bvx.onrender.com/get-disasters');
                const data = await response.json();
                
                data.forEach(d => {
                    if (!processedIds.has(d._id)) {
                        processedIds.add(d._id);
                        triggerDisaster(d);
                    }
                });
            } catch (err) {
                document.getElementById('status-dot').style.background = 'red';
                document.getElementById('status-text').innerText = "LINK LOST";
            }
        }

        function triggerDisaster(d) {
            const coords = cityCoords[d.location] || [22 + (Math.random()*2), 79 + (Math.random()*2)];
            const isQuake = d.type === 'Earthquake';
            const color = isQuake ? '#ff4d4d' : '#00d2ff';

            const marker = L.circleMarker(coords, {
                radius: d.value * 5,
                color: color,
                fillColor: color,
                fillOpacity: 0.6,
                weight: 2
            }).addTo(map);

            setTimeout(() => { map.removeLayer(marker); }, 4000);

            const overlay = document.getElementById('ui-overlay');
            const toast = document.createElement('div');
            toast.className = `notification ${isQuake ? 'quake-notif' : 'flood-notif'}`;
            toast.innerHTML = `
                <div class="notif-title">🚨 ${d.type.toUpperCase()} DETECTED</div>
                <div class="notif-loc">${d.location}</div>
                <div class="notif-val">${d.value}</div>
            `;
            overlay.appendChild(toast);

            setTimeout(() => {
                toast.style.transform = "translateX(100%)";
                toast.style.opacity = "0";
                toast.style.transition = "0.6s ease-in";
                setTimeout(() => toast.remove(), 600);
            }, 8000);
        }

        setInterval(updateRadar, 3000);
        updateRadar();
    </script>
</body>
</html>
