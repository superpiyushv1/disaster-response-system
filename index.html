<!DOCTYPE html>
<html>
<head>
    <title>India Disaster Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #0b0d17; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 85vh; width: 100%; border-bottom: 2px solid #2d3748; }
        #header { padding: 15px; text-align: center; background: #1a202c; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #48bb78; box-shadow: 0 0 8px #48bb78; }
        .alert-popup { color: #1a202c; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">
        <h1 style="margin:0; color: #f56565;">🛰️ DISASTER COMMAND CENTER: INDIA</h1>
        <p><span class="status-dot online"></span> System Status: <span id="conn-text">Syncing with Render...</span></p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([22.5937, 78.9629], 5); // Focused on Central India
        
        // Premium Dark Map Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // Coordination Database for your Indian Hubs
        const cityCoords = {
            "Janakpuri, New Delhi": [28.6215, 77.0878],
            "Connaught Place, New Delhi": [28.6315, 77.2167],
            "Cyber City, Gurugram": [28.4951, 77.0894],
            "Bandra West, Mumbai": [19.0596, 72.8295],
            "Whitefield, Bengaluru": [12.9698, 77.7500],
            "Koramangala, Bengaluru": [12.9352, 77.6245],
            "HITEC City, Hyderabad": [17.4483, 78.3741],
            "Noida Sector 18, UP": [28.5708, 77.3261],
            "Salt Lake, Kolkata": [22.5851, 88.4231]
        };

        async function fetchLiveMarkers() {
            try {
                const response = await fetch('https://disaster-backend-api-7bvx.onrender.com/get-disasters');
                const data = await response.json();
                
                // Clear old markers before redrawing
                map.eachLayer((layer) => {
                    if (layer instanceof L.CircleMarker) map.removeLayer(layer);
                });

                data.forEach(d => {
                    const coords = cityCoords[d.location] || [22, 79]; 
                    const isHigh = d.severity === "HIGH_ALERT";
                    
                    const marker = L.circleMarker(coords, {
                        color: d.type === 'Earthquake' ? '#f56565' : '#4299e1',
                        fillColor: d.type === 'Earthquake' ? '#f56565' : '#4299e1',
                        fillOpacity: 0.6,
                        radius: isHigh ? (d.value * 2) : (d.value * 1.5),
                        weight: isHigh ? 3 : 1
                    }).addTo(map);
                    
                    marker.bindPopup(`<div class="alert-popup">${d.type} Alert<br>Value: ${d.value}<br>Loc: ${d.location}</div>`);
                });

                document.getElementById('conn-text').innerText = "LIVE - Connected to Cloud DB";
            } catch (err) {
                document.getElementById('conn-text').innerText = "CONNECTION LOST";
                document.getElementById('conn-text').style.color = "red";
            }
        }

        // Auto-refresh every 5 seconds
        setInterval(fetchLiveMarkers, 5000);
        fetchLiveMarkers();
    </script>
</body>
</html>
