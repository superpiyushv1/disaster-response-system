<!DOCTYPE html>
<html>
<head>
    <title>Smart Disaster Response System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0e14;
            --accent-red: #ff4d4d;
            --accent-blue: #00d2ff;
            --accent-orange: #ff9f43;
            --panel-bg: #141820; 
        }

        body { 
            margin: 0; 
            background: var(--bg-dark); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        #map-wrapper {
            height: 100vh;
            width: 100%;
            background: #000;
            position: absolute;
            z-index: 1;
        }

        #map { 
            height: 100%; 
            width: 100%; 
            /* ZERO FILTERS - CRYSTAL CLEAR MAP */
        }
        
        #header-lite {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--panel-bg);
            padding: 12px 30px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #fff;
        }

        #ui-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 320px;
            z-index: 1000;
            display: flex;
            flex-direction: column-reverse; 
            gap: 15px;
        }

        .notification {
            background: var(--panel-bg);
            border: 2px solid rgba(255, 255, 255, 0.15); 
            border-left: 6px solid var(--accent-red); 
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .quake-notif { border-left-color: var(--accent-red); }
        .flood-notif { border-left-color: var(--accent-blue); }
        .notif-title { font-weight: 700; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .notif-loc { font-size: 15px; color: #fff; font-weight: bold; }
        .notif-val { font-family: 'Orbitron', sans-serif; font-size: 22px; margin-top: 8px; }
        .quake-notif .notif-val { color: var(--accent-red); }
        .flood-notif .notif-val { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div id="header-lite">
        <h1>SMART DISASTER RESPONSE SYSTEM</h1>
        <div style="font-size: 10px; color: #48bb78; margin-top: 4px; letter-spacing: 1px;">● RADAR ACTIVE</div>
    </div>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>
    
    <div id="ui-overlay"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 4,
            maxZoom: 12
        }).setView([22.5937, 78.9629], 5);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO',
            noWrap: true
        }).addTo(map);

        fetch('https://raw.githubusercontent.com/datameet/maps/master/Country/india-composite.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: "#ff9f43", 
                        weight: 2,
                        opacity: 0.9,
                        fillColor: "transparent",
                        interactive: false
                    }
                }).addTo(map);
            });

        const cityCoords = {
            "Janakpuri, New Delhi": [28.6215, 77.0878],
            "Connaught Place, New Delhi": [28.6315, 77.2167],
            "Cyber City, Gurugram": [28.4951, 77.0894],
            "Noida Sector 18, UP": [28.5708, 77.3261],
            "Whitefield, Bengaluru": [12.9698, 77.7500],
            "Koramangala, Bengaluru": [12.9352, 77.6245],
            "HITEC City, Hyderabad": [17.4483, 78.3741],
            "Salt Lake, Kolkata": [22.5851, 88.4231],
            "Bandra West, Mumbai": [19.0596, 72.8295],
            "Powai, Mumbai": [19.1176, 72.9060],
            "T Nagar, Chennai": [13.0418, 80.2341],
            "Pune City, MH": [18.5204, 73.8567]
        };

        let processedIds = new Set();

        async function updateRadar() {
            try {
                const response = await fetch('https://disaster-backend-api-7bvx.onrender.com/get-disasters');
                const data = await response.json();
                data.forEach(d => {
                    if (!processedIds.has(d._id)) {
                        processedIds.add(d._id);
                        triggerDisaster(d);
                    }
                });
            } catch (err) { console.log("Sync error"); }
        }

        function triggerDisaster(d) {
            const coords = cityCoords[d.location] || [22 + (Math.random()*2), 79 + (Math.random()*2)];
            const color = d.type === 'Earthquake' ? '#ff4d4d' : '#00d2ff';

            const marker = L.circleMarker(coords, {
                radius: d.value * 5,
                color: color,
                fillColor: color,
                fillOpacity: 0.6,
                weight: 2
            }).addTo(map);

            setTimeout(() => { map.removeLayer(marker); }, 4000);

            const overlay = document.getElementById('ui-overlay');
            const toast = document.createElement('div');
            toast.className = `notification ${d.type === 'Earthquake' ? 'quake-notif' : 'flood-notif'}`;
            toast.innerHTML = `
                <div class="notif-title">🚨 ${d.type.toUpperCase()} DETECTED</div>
                <div class="notif-loc">${d.location}</div>
                <div class="notif-val">${d.value}</div>
            `;
            overlay.appendChild(toast);

            setTimeout(() => {
                toast.style.transform = "translateX(120%)";
                toast.style.opacity = "0";
                toast.style.transition = "0.6s ease-in";
                setTimeout(() => toast.remove(), 600);
            }, 8000);
        }

        setInterval(updateRadar, 3000);
        updateRadar();
    </script>
</body>
</html>
